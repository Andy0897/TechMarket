<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.w3.org/1999/xhtml" xmlns:sec="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/head}"></head>
<body>
<nav th:replace="~{fragments/navbar}"></nav>
<header class="page-header">
    <h1>🔍 Детайли за продукта</h1>
</header>
<main class="container py-5">
    <div class="shop-card p-4 mb-5">
        <div class="row">
            <div class="col-md-6">
                <img id="mainImage"
                     th:src="@{'data:image/jpeg;base64,'+ ${encoder.encodeToBase64(product.images.get(0))}}"
                     class="w-100 rounded shadow mb-3"
                     style="height:380px;object-fit:cover">
                <div class="d-flex gap-2 flex-wrap">
                    <img th:each="img,stat : ${product.images}"
                         th:src="@{'data:image/jpeg;base64,'+ ${encoder.encodeToBase64(img)}}"
                         class="thumb-img"
                         th:onclick="changeImage(this)"
                         style="height:70px;width:70px;object-fit:cover;
                         border-radius:8px;cursor:pointer">
                </div>
            </div>
            <div class="col-md-6">
                <h3 class="fw-bold"
                    th:text="${product.title}">
                </h3>
                <span class="soft-badge"
                      th:text="${product.condition.displayName}">
                </span>
                <p class="mt-3"
                   th:text="${product.description}">
                </p>
                <h4 class="price">
                    <span th:text="${product.price}"></span> лв.
                </h4>
                <form th:action="@{/carts/submit-add-product/{id}(id=${product.id})}"
                      sec:authorize="hasAuthority('USER')"
                      method="post">
                    <button class="shop-btn w-100 mt-3">
                        Добави в количката
                    </button>
                </form>
                <form action="#" sec:authorize="hasAuthority('ADMIN')">
                    <button class="shop-btn-disabled w-100 mt-3">
                        Не можете да добавяте в количката
                    </button>
                </form>
            </div>
        </div>
    </div>
    <h3 class="section-title">
        Подобни продукти
    </h3>
    <div class="row g-4">
        <div class="col-md-4"
             th:each="r:${relatedProducts}">
            <div class="shop-card h-100">
                <img th:src="@{'data:image/jpeg;base64,'+ ${encoder.encodeToBase64(r.images.get(0))}}"
                     style="height:180px;object-fit:cover;width:100%">
                <div class="p-3">
                    <h6 class="fw-bold"
                        th:text="${r.title}">
                    </h6>
                    <p class="text-muted small"
                        th:text="${#strings.length(r.description)>80
                        ? #strings.substring(r.description,0,80)+'...'
                        : r.description}">
                    </p>
                    <button class="btn btn-outline-primary w-100"
                            th:onclick="|location.href='/products/${r.id}'|">
                        Виж продукта
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/footer}"></footer>
<script>
    function changeImage(el){
        document.getElementById("mainImage").src = el.src;
    }
</script>
</body>
</html>
