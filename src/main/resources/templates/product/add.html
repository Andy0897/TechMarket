<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/head}"></head>
<body>
<nav th:replace="~{fragments/navbar}"></nav>
<header class="page-header">
    <h1>Добави продукт</h1>
    <p>Администраторски панел</p>
</header>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="shop-card p-4">
                <form th:action="@{/products/submit}"
                      method="post"
                      th:object="${product}"
                      enctype="multipart/form-data">
                    <div class="mb-3">
                        <label>Снимки</label>
                        <input type="file"
                               class="form-control"
                               name="images"
                               multiple>
                    </div>
                    <div class="mb-3">
                        <label>Заглавие</label>
                        <input class="form-control"
                               th:field="*{title}">
                    </div>
                    <div class="mb-3">
                        <label>Описание</label>
                        <textarea class="form-control"
                                  rows="4"
                                  th:field="*{description}">
                        </textarea>
                    </div>
                    <div class="mb-3">
                        <label>Цена</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{price}">
                    </div>
                    <div class="mb-3">
                        <label>Категория</label>
                        <select class="form-select"
                                th:field="*{category}">
                            <option th:each="c:${categories}"
                                    th:value="${c.id}"
                                    th:text="${c.name}">
                            </option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label>Състояние</label>
                        <select class="form-select"
                                th:field="*{condition}">
                            <option value="NEW">Ново</option>
                            <option value="VERY_GOOD">Много добро</option>
                            <option value="USED">Използвано</option>
                            <option value="DEFECT">С дефект</option>
                        </select>
                    </div>
                    <button class="shop-btn w-100">
                        Запази продукта
                    </button>
                </form>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/footer}"></footer>
</body>
</html>
