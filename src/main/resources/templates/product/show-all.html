<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/head}"></head>

<body>

<nav th:replace="~{fragments/navbar}"></nav>

<div class="container mt-5">

    <h2 class="page-title text-center mb-5">
        Налична техника
    </h2>

    <div class="row g-4">

        <div class="col-md-4"
             th:each="product : ${products}">

            <div class="tech-card">

                <img th:if="${product.images.size() > 0}"
                     th:src="@{'data:image/jpeg;base64,' + ${encoder.encodeToBase64(product.images.get(0))}}">

                <img th:if="${product.images.size() == 0}"
                     src="/images/no-image.png">

                <div class="tech-card-body">

                    <h5 th:text="${product.title}"></h5>

                    <span class="tech-condition"
                          th:text="${product.condition.displayName}">
                    </span>

                    <p class="tech-price mt-2">
                        <span th:text="${product.price}"></span> лв.
                    </p>

                    <button class="tech-btn w-100"
                            th:onclick="|location.href='/products/${product.id}';|">
                        Виж повече
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<footer th:replace="~{fragments/footer}"></footer>

</body>
</html>
