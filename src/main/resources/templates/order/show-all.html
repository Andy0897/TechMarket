<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/head}"></head>
<body>
<nav th:replace="~{fragments/navbar}"></nav>
<main>
    <h2>Завърши поръчка</h2>
    <div th:each="order : ${orders}">
        <h2 th:text="|${order.buyer.firstName} ${order.buyer.lastName}|"></h2>
        <p th:text="|${order.city} ${order.address}|"></p>
        <button th:onclick="|location.href='/orders/${order.id}';|">Виж повече</button>
    </div>
</main>
<footer th:replace="~{fragments/footer}"></footer>
</body>
</html>
