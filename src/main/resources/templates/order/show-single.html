<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.w3.org/1999/xhtml"
      xmlns:sec="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/head}"></head>
<body class="order-details-body">
<nav th:replace="~{fragments/navbar}"></nav>
<main class="order-details-wrapper">
    <div class="order-details-card">
        <h2 class="order-details-title">
            📦 Поръчка №<span th:text="${order.id}"></span>
        </h2>
        <div class="order-details-info">
            <p>
                👤 Клиент:
                <strong th:text="|${order.buyer.firstName} ${order.buyer.lastName}|"></strong>
            </p>
            <p>
                📍 Адрес:
                <span th:text="|${order.city}, ${order.address}|"></span>
            </p>
            <p>
                💰 Обща сума:
                <strong th:text="|${order.totalPrice} лв.|"></strong>
            </p>
            <p>
                📌 Статус:
                <span class="order-details-status"
                      th:text="${order.orderStatus.displayName}">
                </span>
            </p>
        </div>
        <div sec:authorize="hasAuthority('ADMIN')" class="order-details-admin">
            <h4>⚙ Управление на поръчката</h4>
            <form th:action="@{/orders/submit-change-order-status/{orderId}(orderId=${order.id})}"
                  method="post">
                <label>Статус</label>
                <select name="orderStatus" class="order-details-select">
                    <option value="IN_REVIEW">В обработка</option>
                    <option value="SENT">Изпратена</option>
                    <option value="DELIVERED">Доставена</option>
                </select>
                <button type="submit" class="order-details-btn">
                    Запази промяната
                </button>
            </form>
        </div>
        <div class="mt-5">
            <h4 class="fw-bold mb-4 text-center">
                🛍 Продукти в поръчката
            </h4>
            <div class="row g-4">
                <div class="col-lg-4 col-md-6"
                     th:each="product : ${order.products}">
                    <div class="card h-100 shadow-sm border-0">
                        <img class="card-img-top"
                             style="height:200px; object-fit:contain;"
                             th:src="@{'data:image/jpeg;base64,' + ${encoder.encodeToBase64(product.images.get(0))}}">
                        <div class="card-body d-flex flex-column">
                            <h6 class="fw-bold mb-2"
                                th:text="${product.title}">
                            </h6>
                            <div class="mt-auto">
                                <span class="badge bg-primary fs-6">
                                    <span th:text="${#numbers.formatDecimal(product.price, 2, 2)}"></span> лв.
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/footer}"></footer>
</body>
</html>
