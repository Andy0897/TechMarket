<head xmlns:th="http://www.w3.org/1999/xhtml">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TeacherConnect</title>
    <link th:href="@{/styles/styles.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    <style>
        main {
            min-height: 50vh;
        }

        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --accent: #38bdf8;
            --text-main: #e5e7eb;
            --text-muted: #94a3b8;
        }

        body {
            background: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
        }

        a {
            text-decoration: none;
        }

        .tech-navbar {
            background: #020617;
            padding: 15px 0;
            border-bottom: 1px solid #1e293b;
        }

        .nav-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tech-logo {
            color: var(--accent);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .tech-nav-links a {
            margin: 0 12px;
            color: var(--text-main);
            font-weight: 500;
            transition: 0.2s;
        }

        .tech-nav-links a:hover {
            color: var(--accent);
        }

        .tech-nav-auth {
            display: flex;
            gap: 10px;
        }

        .nav-auth-link {
            color: var(--text-muted);
        }

        .nav-auth-btn {
            background: var(--accent);
            color: #020617;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 600;
        }

        .nav-auth-btn:hover {
            background: #0ea5e9;
        }

        .tech-nav-links a {
            position: relative;
        }

        .tech-nav-links a::after {
            content: "";
            position: absolute;
            width: 0;
            height: 2px;
            background: var(--accent);
            bottom: -4px;
            left: 0;
            transition: 0.3s;
        }

        .tech-nav-links a:hover::after {
            width: 100%;
        }

        .page-title {
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--accent);
        }

        .tech-card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            transition: 0.3s;
        }

        .tech-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 25px rgba(56,189,248,0.2);
        }

        .tech-card img {
            height: 220px;
            object-fit: cover;
        }

        .tech-card-body {
            padding: 15px;
        }

        .tech-price {
            color: var(--accent);
            font-weight: bold;
        }

        .tech-condition {
            background: rgba(56,189,248,0.15);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
        }

        .tech-btn {
            background: var(--accent);
            border: none;
            color: #020617;
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.3s;
        }

        .tech-btn:hover {
            background: #0ea5e9;
        }

        .tech-image-box {
            background: var(--bg-card);
            padding: 15px;
            border-radius: 16px;
        }

        .tech-desc {
            color: var(--text-muted);
            line-height: 1.6;
        }

        .tech-form {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 18px;
        }

        .tech-input {
            background: #020617;
            border: 1px solid #334155;
            color: var(--text-main);
            border-radius: 10px;
        }

        .tech-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 0.15rem rgba(56,189,248,.25);
        }

        .tech-card h5 {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .tech-card p {
            margin-bottom: 10px;
        }

        .tech-gallery {
            background: var(--bg-card);
            padding: 15px;
            border-radius: 18px;
        }

        .tech-main-img {
            width: 100%;
            height: 380px;
            object-fit: cover;
            border-radius: 14px;
        }

        .tech-thumbs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tech-thumb {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            opacity: 0.7;
            transition: 0.2s;
        }

        .tech-thumb:hover {
            opacity: 1;
            transform: scale(1.05);
            border: 2px solid var(--accent);
        }

        .cart-box {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 18px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #334155;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item-info h5 {
            margin: 0;
        }

        .cart-price {
            color: var(--accent);
            font-weight: 600;
        }

        .cart-remove-btn {
            background: transparent;
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 6px 14px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .cart-remove-btn:hover {
            background: #ef4444;
            color: #fff;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            font-size: 18px;
        }

        .order-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 16px;
            transition: 0.3s;
        }

        .order-card:hover {
            box-shadow: 0 10px 25px rgba(56,189,248,0.15);
            transform: translateY(-4px);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-status {
            background: rgba(56,189,248,0.15);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .order-address {
            color: var(--text-muted);
            margin: 10px 0;
        }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-price {
            font-weight: 600;
            color: var(--accent);
        }

        .order-details-box {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 18px;
        }

        .order-info p {
            margin: 10px 0;
            font-size: 15px;
        }

        .order-status-box {
            border-top: 1px solid #334155;
            padding-top: 20px;
        }

        .order-form select {
            background: #020617;
            color: var(--text-main);
        }

        .order-price {
            color: var(--accent);
        }

        .order-status {
            background: rgba(56,189,248,0.15);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .tech-form {
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .tech-form::before {
            content: "Данни за доставка";
            display: block;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--accent);
            font-size: 18px;
        }

        .user-order-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 16px;
            transition: 0.3s;
        }

        .user-order-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(56,189,248,0.15);
        }

        .user-order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-order-city {
            font-weight: 600;
        }

        .user-order-status {
            background: rgba(56,189,248,0.15);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .user-order-address {
            color: var(--text-muted);
            margin: 10px 0;
        }

        .user-order-footer {
            display: flex;
            justify-content: flex-end;
        }

        .user-order-price {
            font-weight: 600;
            color: var(--accent);
        }

        .tech-footer {
            background: #020617;
            padding: 40px 0;
            margin-top: 80px;
        }

        .footer-title {
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 12px;
        }

        .footer-text {
            color: var(--text-muted);
            font-size: 14px;
        }

        .footer-links {
            list-style: none;
            padding: 0;
        }

        .footer-links li {
            margin-bottom: 6px;
        }

        .footer-links a {
            color: var(--text-muted);
            transition: 0.2s;
        }

        .footer-links a:hover {
            color: var(--accent);
        }

        .footer-line {
            border-color: #1e293b;
            margin: 20px 0;
        }

        .footer-copy {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        .hero-section {
            background: linear-gradient(135deg, #020617, #0f172a);
            padding: 120px 0;
        }

        .hero-title {
            font-size: 60px;
            font-weight: 700;
            color: var(--accent);
        }

        .hero-subtitle {
            color: var(--text-muted);
            margin: 20px 0;
            font-size: 18px;
        }

        .hero-btn {
            padding: 12px 30px;
            font-size: 18px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 40px;
            font-weight: 600;
            color: white;
        }

        .why-section {
            padding: 80px 0;
            background: #020617;
        }

        .why-card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 30px;
        }

        .why-card h5 {
            margin-top: 10px;
        }

        .cta-section {
            padding: 80px 0;
        }

        .cta-btn {
            padding: 14px 40px;
            font-size: 20px;
        }

        .auth-page {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 18px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 40px #38bdf822;
        }

        .auth-title {
            text-align: center;
            margin-bottom: 30px;
            color: var(--accent);
        }

        .auth-input {
            background: #020617;
            border: 1px solid #1e293b;
            color: white;
        }

        .auth-input:focus {
            background: #020617;
            color: white;
            border-color: var(--accent);
            box-shadow: none;
        }

        .auth-btn {
            padding: 12px;
            font-weight: 600;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--accent);
        }

    </style>
</head>
