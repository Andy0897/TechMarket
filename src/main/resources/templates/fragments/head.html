<head xmlns:th="http://www.w3.org/1999/xhtml">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TehnicaBG</title>
    <link th:href="@{/styles/styles.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    <style>
        main {
            min-height: 50vh;
        }

        body{
            background:#eef2f7;
            font-family:'Segoe UI',sans-serif;
            color:#1f2937;
        }

        .page-header{
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            color:white;
            padding:10px 20px;
            text-align:center;
        }

        .page-header h1{
            font-weight:700;
        }

        .shop-card{
            background:white;
            border-radius:16px;
            box-shadow:0 8px 20px rgba(0,0,0,0.08);
            overflow:hidden;
            transition:.3s;
        }

        .shop-card:hover{
            transform:translateY(-6px);
            box-shadow:0 15px 35px rgba(0,0,0,0.15);
        }

        .shop-btn{
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            border:none;
            color:white;
            padding:12px;
            border-radius:10px;
            font-weight:600;
        }

        .shop-btn:hover{
            opacity:.9;
        }

        .soft-badge{
            background:#e0e7ff;
            color:#4338ca;
            padding:6px 14px;
            border-radius:20px;
            font-size:14px;
            font-weight:600;
        }

        .form-control,
        .form-select{
            border-radius:10px;
        }

        .price{
            color:#2563eb;
            font-weight:700;
        }

        .section-title{
            font-weight:700;
            margin-bottom:25px;
        }

        .thumb-img{
            opacity:0.7;
            border:2px solid transparent;
            transition:.3s;
        }

        .thumb-img:hover{
            opacity:1;
        }

        .thumb-img.active{
            border-color:#2563eb;
            opacity:1;
        }

        .order-card{
            background:white;
            border-radius:18px;
            box-shadow:0 10px 30px rgba(0,0,0,.1);
            padding:25px;
            transition:.3s;
        }

        .order-card:hover{
            transform:translateY(-4px);
        }

        .status{
            padding:6px 14px;
            border-radius:50px;
            font-size:14px;
            font-weight:600;
            display:inline-block;
        }

        .IN_REVIEW{
            background:#facc15;
            color:#78350f;
        }

        .SENT{
            background:#60a5fa;
            color:#1e3a8a;
        }

        .DELIVERED{
            background:#4ade80;
            color:#064e3b;
        }

        .product-row{
            background:#f1f5f9;
            border-radius:10px;
            padding:10px;
            margin-bottom:8px;
        }

        .product-row img{
            width:60px;
            height:60px;
            object-fit:cover;
            border-radius:8px;
        }

        .total{
            font-size:20px;
            font-weight:bold;
            color:#2563eb;
        }

        .checkout-box{
            max-width:500px;
            margin:auto;
            background:white;
            padding:35px;
            border-radius:20px;
            box-shadow:0 15px 35px rgba(0,0,0,.12);
        }

        .checkout-box h2{
            text-align:center;
            margin-bottom:25px;
            color:#2563eb;
        }

        .form-group{
            margin-bottom:18px;
        }

        .form-group label{
            font-weight:600;
            margin-bottom:6px;
            display:block;
        }

        .form-group input{
            width:100%;
            padding:10px 14px;
            border-radius:10px;
            border:1px solid #cbd5f5;
            outline:none;
            transition:.2s;
        }

        .form-group input:focus{
            border-color:#2563eb;
            box-shadow:0 0 0 2px rgba(37,99,235,.2);
        }

        .error{
            color:#dc2626;
            font-size:14px;
        }

        .checkout-btn{
            width:100%;
            padding:12px;
            background:#2563eb;
            border:none;
            color:white;
            border-radius:12px;
            font-size:18px;
            font-weight:600;
            transition:.3s;
        }

        .checkout-btn:hover{
            background:#1e40af;
        }

        .admin-orders{
            max-width:1100px;
            margin:auto;
        }

        .admin-orders h2{
            text-align:center;
            margin-bottom:35px;
            color:#2563eb;
            font-weight:700;
        }

        .order-card{
            background:white;
            border-radius:18px;
            padding:25px;
            box-shadow:0 12px 30px rgba(0,0,0,.1);
            margin-bottom:20px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            transition:.3s;
        }

        .order-card:hover{
            transform:translateY(-4px);
            box-shadow:0 18px 40px rgba(0,0,0,.15);
        }

        .order-info h3{
            margin:0;
            font-size:20px;
            font-weight:600;
        }

        .order-info p{
            margin:4px 0;
            color:#555;
        }

        .admin-btn{
            padding:10px 18px;
            background:#2563eb;
            border:none;
            color:white;
            border-radius:12px;
            font-weight:600;
            transition:.3s;
        }

        .admin-btn:hover{
            background:#1e40af;
        }

        .myorders-header h2{
            margin:0;
            font-weight:700;
        }

        .myorders-wrapper{
            max-width:900px;
            margin:auto;
        }

        .myorders-empty{
            text-align:center;
            font-size:18px;
            color:#555;
        }

        .myorders-card{
            background:white;
            border-radius:18px;
            padding:25px;
            margin-bottom:20px;
            box-shadow:0 12px 30px rgba(0,0,0,.08);
            display:flex;
            justify-content:space-between;
            align-items:center;
            transition:.3s;
        }

        .myorders-card:hover{
            transform:translateY(-4px);
            box-shadow:0 18px 40px rgba(0,0,0,.12);
        }

        .myorders-left h4{
            margin-bottom:10px;
            font-weight:600;
        }

        .myorders-left p{
            margin:4px 0;
            color:#555;
        }

        .myorders-status{
            display:inline-block;
            padding:6px 14px;
            border-radius:20px;
            background:#facc15;
            font-size:14px;
            font-weight:600;
            margin-bottom:10px;
        }

        .myorders-right{
            text-align:right;
            font-size:17px;
            font-weight:600;
            color:#2563eb;
        }

        .myorders-btn{
            border:none;
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            color:white;
            padding:10px 20px;
            border-radius:25px;
            font-size:14px;
            font-weight:600;
            cursor:pointer;
            transition:.3s;
            margin-top:10px;
        }

        .myorders-btn:hover{
            opacity:.9;
            transform:scale(1.05);
        }

        .order-details-body{
            background:#f4f7fb;
        }

        .order-details-wrapper{
            max-width:900px;
            margin:60px auto;
            padding:0 20px;
        }

        .order-details-card{
            background:white;
            border-radius:16px;
            padding:30px;
            box-shadow:0 15px 40px rgba(0,0,0,.1);
        }

        .order-details-title{
            font-size:26px;
            margin-bottom:20px;
            text-align:center;
            background:linear-gradient(90deg,#2563eb,#7c3aed);
            -webkit-background-clip:text;
            color:transparent;
        }

        .order-details-info p{
            font-size:16px;
            margin:12px 0;
        }

        .order-details-status{
            padding:6px 14px;
            border-radius:20px;
            background:#fde68a;
            font-weight:600;
        }

        .order-details-admin{
            margin-top:30px;
            padding:20px;
            border-radius:12px;
            background:#f1f5ff;
        }

        .order-details-admin h4{
            margin-bottom:15px;
        }

        .order-details-select{
            width:100%;
            padding:10px;
            border-radius:10px;
            border:1px solid #ddd;
            margin-bottom:15px;
        }

        .order-details-btn{
            width:100%;
            padding:12px;
            border:none;
            border-radius:25px;
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            color:white;
            font-weight:600;
            cursor:pointer;
            transition:.3s;
        }

        .order-details-btn:hover{
            opacity:.9;
            transform:scale(1.03);
        }

        .cart-body{
            background:#f4f7fb;
        }

        .cart-wrapper{
            max-width:900px;
            margin:60px auto;
            padding:0 20px;
        }

        .cart-title{
            text-align:center;
            font-size:28px;
            margin-bottom:30px;
            background:linear-gradient(90deg,#2563eb,#7c3aed);
            -webkit-background-clip:text;
            color:transparent;
        }

        .cart-container{
            display:flex;
            flex-direction:column;
            gap:20px;
        }

        .cart-item{
            background:white;
            border-radius:14px;
            padding:20px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            box-shadow:0 10px 25px rgba(0,0,0,.08);
        }

        .cart-item-info h3{
            margin:0;
            font-size:18px;
        }

        .cart-price{
            color:#2563eb;
            font-weight:600;
            margin-top:6px;
        }

        .cart-remove-btn{
            background:#ef4444;
            color:white;
            border:none;
            padding:10px 18px;
            border-radius:20px;
            cursor:pointer;
            transition:.3s;
        }

        .cart-remove-btn:hover{
            background:#dc2626;
            transform:scale(1.05);
        }

        .cart-total{
            margin-top:30px;
            background:#eef2ff;
            border-radius:16px;
            padding:25px;
            text-align:center;
        }

        .cart-total h3{
            margin-bottom:15px;
            font-size:22px;
        }

        .cart-order-btn{
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            color:white;
            border:none;
            padding:14px 35px;
            border-radius:30px;
            font-size:16px;
            cursor:pointer;
            transition:.3s;
        }

        .cart-order-btn:hover{
            opacity:.9;
            transform:scale(1.05);
        }

        .auth-body{
            background:linear-gradient(135deg,#e0e7ff,#f5f3ff);
        }

        .auth-wrapper{
            min-height:80vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .auth-card{
            background:white;
            width:100%;
            max-width:420px;
            padding:35px;
            border-radius:18px;
            box-shadow:0 15px 40px rgba(0,0,0,.12);
        }

        .auth-title{
            text-align:center;
            font-size:26px;
            margin-bottom:25px;
            background:linear-gradient(90deg,#2563eb,#7c3aed);
            -webkit-background-clip:text;
            color:transparent;
        }

        .auth-form{
            display:flex;
            flex-direction:column;
            gap:18px;
        }

        .auth-group label{
            font-weight:600;
            margin-bottom:6px;
            display:block;
        }

        .auth-group input{
            width:100%;
            padding:12px;
            border-radius:12px;
            border:1px solid #ddd;
        }

        .auth-btn{
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            color:white;
            border:none;
            padding:12px;
            border-radius:30px;
            font-size:16px;
            cursor:pointer;
            transition:.3s;
        }

        .auth-btn:hover{
            opacity:.9;
            transform:scale(1.03);
        }

        .auth-link{
            text-align:center;
            margin-top:10px;
        }

        .auth-link a{
            color:#2563eb;
            font-weight:600;
        }

        .auth-alert{
            padding:12px;
            border-radius:10px;
            margin-bottom:15px;
            font-size:14px;
        }

        .auth-error{
            background:#fee2e2;
            color:#b91c1c;
        }

        .auth-success{
            background:#dcfce7;
            color:#166534;
        }

        .auth-error-text{
            font-size:13px;
            color:#dc2626;
            margin-top:4px;
        }

        .clean-navbar{
            box-shadow:0 6px 20px rgba(0,0,0,0.25);
        }

        .dropdown-menu{
            border-radius:12px;
            padding:8px;
        }

        .btn:hover{
            transform:translateY(-1px);
        }

        @media(max-width:991px){
            .navbar-collapse{
                background:#0d6efd;
                padding:15px;
                border-radius:12px;
                margin-top:10px;
            }
        }

        .home-body{
            background:#f4f7fb;
        }

        .home-wrapper{
            max-width:1200px;
            margin:auto;
            padding:50px 20px;
        }

        .home-hero{
            text-align:center;
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            padding:60px;
            border-radius:20px;
            color:white;
        }

        .home-btn{
            display:inline-block;
            margin-top:20px;
            background:white;
            color:#2563eb;
            padding:12px 35px;
            border-radius:30px;
            font-weight:600;
            text-decoration:none;
        }

        .home-features{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:25px;
            margin-top:40px;
        }

        .feature-card{
            background:white;
            padding:25px;
            border-radius:16px;
            text-align:center;
            box-shadow:0 10px 25px rgba(0,0,0,.08);
        }

        .main-footer{
            background:#111827;
            color:white;
            padding:40px 20px;
        }

        .footer-container{
            max-width:1200px;
            margin:auto;
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
            gap:30px;
        }

        .footer-container a{
            display:block;
            color:#9ca3af;
            text-decoration:none;
            margin:6px 0;
        }

        .footer-copy{
            text-align:center;
            margin-top:30px;
            color:#9ca3af;
        }
    </style>
</head>
