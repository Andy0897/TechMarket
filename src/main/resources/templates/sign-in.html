<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/head}"></head>
<body>
<nav th:replace="~{fragments/navbar}"></nav>
<main>
    <h2>Вход</h2>
    <div th:if="${param.error}">Невалидно потребителско име/имейл или парола.</div>
    <div th:if="${param.logout}">Излязохте успешно от профила си.</div>
    <form th:action="@{/sign-in}" method="post">
        <div>
            <label for="usernameOrEmail">Потребителско име или имейл</label>
            <input type="text" id="usernameOrEmail" name="usernameOrEmail">
        </div>
        <div>
            <label for="password">Парола</label>
            <input type="password" id="password" name="password">
        </div>
        <button type="submit">Вход</button>
        <div> Нямаш акаунт?
            <a href="/sign-up">Регистрирай се</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/footer}"></footer>
</body>
</html>
