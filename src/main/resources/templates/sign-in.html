<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/head}"></head>
<body>

<nav th:replace="~{fragments/navbar}"></nav>

<main class="auth-page">

    <div class="auth-card">

        <h2 class="auth-title">Вход</h2>

        <div class="alert alert-danger" th:if="${param.error}">
            Невалидно потребителско име/имейл или парола.
        </div>

        <div class="alert alert-success" th:if="${param.logout}">
            Излязохте успешно от профила си.
        </div>

        <form th:action="@{/sign-in}" method="post">

            <div class="mb-3">
                <label for="usernameOrEmail" class="form-label">
                    Потребителско име или имейл
                </label>
                <input type="text"
                       id="usernameOrEmail"
                       name="usernameOrEmail"
                       class="form-control auth-input"
                       placeholder="example@email.com">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">
                    Парола
                </label>
                <input type="password"
                       id="password"
                       name="password"
                       class="form-control auth-input"
                       placeholder="********">
            </div>

            <button type="submit" class="btn btn-primary w-100 auth-btn">
                Вход
            </button>

            <p class="auth-footer">
                Нямаш акаунт?
                <a href="/sign-up">Регистрирай се</a>
            </p>

        </form>

    </div>

</main>

<footer th:replace="~{fragments/footer}"></footer>

</body>
</html>
